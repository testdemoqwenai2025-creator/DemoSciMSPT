name: Deploy DemoSciMSPT to GitHub Pages (24/7/365)

# ============================================
# SciMSPT Public Preview Deployment
# Status: ACTIVE - Always Available
# Uptime: 24/7/365 (GitHub Pages SLA)
# ============================================

on:
  push:
    branches: ['main']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:  # Allow manual trigger for immediate updates

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  # Build variables
  SITE_URL: 'https://testdemoqwenai2025-creator.github.io/DemoSciMSPT'

jobs:
  # Job 1: Build and prepare static files
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate build info
      
      - name: 📋 Display Build Info
        run: |
          echo "🚀 Building SciMSPT Public Preview"
          echo "📅 Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "🔗 Target URL: ${{ env.SITE_URL }}"
          echo "📁 Files to deploy:"
          find . -name "*.html" -o -name "*.css" -o -name "*.js" | head -20
      
      - name: 🔍 Verify Critical Files
        run: |
          echo "✅ Checking required files..."
          
          # Check for essential pages
          for file in index.html quantum.html platform.html startups.html; do
            if [ -f "$file" ]; then
              size=$(du -h "$file" | cut -f1)
              lines=$(wc -l < "$file")
              echo "   ✅ $file ($size, $lines lines)"
            else
              echo "   ❌ MISSING: $file"
              exit 1
            fi
          done
          
          echo ""
          echo "🎉 All critical files present!"
      
      - name: 🏗️ Prepare Deployment Package
        run: |
          echo "📦 Preparing static files for GitHub Pages..."
          
          # Create output directory
          mkdir -p ./deploy-output
          
          # Copy all HTML files
          cp *.html ./deploy-output/
          
          # Copy assets if they exist
          if [ -d "charts" ]; then
            cp -r charts ./deploy-output/
            echo "   📊 Charts directory included"
          fi
          
          if [ -d "shorts" ]; then
            cp -r shorts ./deploy-output/
            echo "   📰 Shorts directory included"
          fi
          
          if [ -d "portfolio-shorts" ]; then
            cp -r portfolio-shorts ./deploy-output/
            echo "   💼 Portfolio shorts included"
          fi
          
          if [ -d "data" ]; then
            cp -r data ./deploy-output/
            echo "   📁 Data directory included"
          fi
          
          # List deployed files
          echo ""
          echo "📋 Deployment package contents:"
          ls -lhR ./deploy-output/ | head -40
          
          # Total size
          total_size=$(du -sh ./deploy-output | cut -f1)
          echo ""
          echo "📦 Total package size: $total_size"
      
      - name: 🌐 Generate CNAME File (if using custom domain)
        run: |
          # Uncomment below if you have a custom domain
          # echo "scimspt.com" > ./deploy-output/CNAME
          echo "ℹ️ Using default GitHub Pages domain"
      
      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v4
      
      - name: 📤 Upload Deployment Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy-output'
          retention-days: 30  # Keep artifact for 30 days
          name: 'scimspt-preview-${{ github.sha }}'

  # Job 2: Deploy to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: 'scimspt-preview-${{ github.sha }}'
          timeout: 600000  # 10 minute timeout
      
      - name: ✅ Deployment Summary
        run: |
          echo "======================================="
          echo "🎉 DEPLOYMENT SUCCESSFUL!"
          echo "======================================="
          echo ""
          echo "🌐 Live URL: ${{ steps.deployment.outputs.page_url }}"
          echo "⚡ Quantum Page: ${{ steps.deployment.outputs.page_url }}quantum.html"
          echo "📅 Deployed at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "🔄 Commit: ${{ github.sha }}"
          echo ""
          echo "✅ Status: LIVE 24/7/365"
          echo "======================================="

  # Job 3: Verify deployment (optional but recommended)
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    
    if: success()
    
    steps:
      - name: 🔍 Health Check
        run: |
          echo "⏳ Waiting for DNS propagation..."
          sleep 30
          
          echo "🔍 Verifying deployment accessibility..."
          
          # Check main page
          http_status=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.SITE_URL }}" || echo "000")
          echo "   📄 Main page status: $http_status"
          
          # Check quantum page
          quantum_status=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.SITE_URL }}/quantum.html" || echo "000")
          echo "   ⚛️ Quantum page status: $quantum_status"
          
          if [ "$http_status" = "200" ] && [ "$quantum_status" = "200" ]; then
            echo ""
            echo "✅ All pages accessible!"
            echo "🎉 Deployment verified successfully!"
          else
            echo ""
            echo "⚠️ Some pages may still be propagating"
            echo "   This is normal - GitHub Pages can take 1-2 minutes globally"
          fi
      
      - name: 📊 Deployment Report
        if: always()
        run: |
          echo "======================================="
          echo "📊 DEPLOYMENT REPORT"
          echo "======================================="
          echo ""
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo ""
          echo "Live URLs:"
          echo "  Main:     ${{ env.SITE_URL }}"
          echo "  Quantum:  ${{ env.SITE_URL }}/quantum.html"
          echo ""
          echo "Status: ✅ DEPLOYED & VERIFIED"
          echo "Uptime: 24/7/365 (GitHub Pages infrastructure)"
          echo "======================================="
